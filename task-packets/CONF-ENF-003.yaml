contracts: ["Base is main 21ae371 (CONF-ENF-002). W04-3 of the adopted W04-0 plan: TG-02 (lifecycle, SOURCE_OWNER_IMPLEMENTATION, obligations E07, E09, E10, acceptance A02, A05, A06) at tests/enforcement/tg02_lifecycle/ and TG-03 (persistence, SOURCE_MULTIPROCESS_FAULT, obligations E10, E11, E12, acceptance A05, A06) at tests/enforcement/tg03_persistence/. One packet, branch and PR.","Owner decisions Q-T8, Q-T9 and Q-T10 (2026-10-13, via the lane monitor) are recorded verbatim in ownerDecisions above and in fixtures/ci/conf-enf-003-checkpoint.json.","Independence: the attestation tests/enforcement/attestations/conf-enf-003.json carries the plan's fields. The gated cases' expected results are the adopted contract vectors' own outputs and final snapshots. LEDGER-E09's subject is R12's own reader (src/harness_conformance/live_proxy_server.py, Q-T9): its source was read only to locate its factory-owned classes, guard state and cleanup rows, and every expected outcome comes from the plan's E09 and A02 text. No R10 source, W03 work in progress or W05 build is read or run; the reader itself is unchanged.","Ledgers: tg02_lifecycle/results.json and tg03_persistence/results.json list each group's plan cases in plan order with phase, obligations, blockers, subject, result, reason, evidence and catalog, and must equal what tests/enforcement/_catalog.py gives. LEDGER-E09 (the only W04_OFFLINE case) is PASS only through the reader guard tests its evidence names, all of which run in the same command. The other 17 cases (14 AFTER_W05_RELEASE_SET, 3 W06_NATIVE_ONLY) are NOT_RUN_ENV_UNAVAILABLE, never PASS; the reason names the phase and any blocker (D-W02A-F2).","Catalog (Q-T8): every gated case is fixed now to the contract vectors that specify it, selected by rules over the vectors' own content in _catalog.py: the I05 v3 transcripts and agreement checks, the I07 v3 transcripts (with the policy writer's own analogues of unarmed, out-of-order and stale-session writes) and the I05 v3 supplement. Examples: CE17, CE21 and CE22 by their transcripts' intents; S63 by the agreement checks that refuse a result attributed to another action (HOST_INTERFACE_SPEC section 6.3); ENOSPC, partial records and restart/rollback by injected storage failures, torn writes, gate restarts, restart-marker failures and replayed executions. Each test pins anchor vectors and the size of every selection. The executable source and the wire-level adapter that run these cases against W05's released build come with W05's release set, together with TG-01's CODEC case.","LEDGER-E09 tests (tg02_lifecycle/test_reader_guards.py): custody ticks of the factory-owned kernel views refuse a closed, failed or idle view, another process or thread, a clock before the last tick, a passed deadline, a foreign inspection owner, an unbound view while a server is installed and a subclass imitation; a failure, a reentrant phase or an overrun deadline inside a phase leaves the view failed for good; a view built without its constructor is never usable and the fixed factories refuse an unsupported host; only the installed server, in its own process and thread, passes its owner check, no caller constructs a qualification binding, and inspections refuse a wrong owner or peer; cleanup closes only the original descriptors under substitution, skips rows never acquired and keeps its failure. The trusted-code boundary is declared in the module; per-tick peer substitution of the observer and broker inspections (a constructed server with live sockets and pidfds, Linux only) is not covered.","I05 v3 supplement (Q-T10): the snapshot manifest moves to v2 with a per-file sourceCommit (a2eab93 for the plan's set and earlier additions, 93d32e1 for architecture/i05-gate-channel-v3-supplement/vectors.json and status.json, both also pinned by sha256 and size in test_bootstrap.py). TG-01 replays S01-S06 as the vector set (I05 gate channel v3, supplement), tagged transcript replay: the supplement must name the pinned v3 vectors and model, and each `equals` relation is checked on the data before the model's replay, which needs jsonschema, so all six are NOT_RUN_ENV_UNAVAILABLE under the profile. TG-03 maps them to its kill, ENOSPC, partial-record and restart/rollback cases.","History: one closed chain record fixtures/ci/conf-enf-003-checkpoint.json and its registry entry; no frozen-code change. Changed: test_bootstrap.py (manifest v2, the new area modules, the one subject import Q-T9), the TG-01 replays, ledger and tests (the supplement set, transcript replay for I05 at 126 vectors, the ledger's packet field, the stale ANCHORS comment of review R4-3), the README, and tests/ci_checkpoint/test_checkpoint_chain.py (the CONF-ENF-003 record test and registry entry 3).","No ci/ path changes and no new command: the 13 CONF-ENF-002 commands are inherited unchanged and in order; the inherited tests/enforcement discover argv runs the new tg02_lifecycle and tg03_persistence packages.","Budget: the full 13-command sandboxed run under Python 3.12.14 took 441 s on this packet's tree (live_backend 391 s, linux_baseline 34 s, ci_checkpoint 6 s, tests/enforcement 5 s with every TG-01 replay, the TG-02/TG-03 ledgers and LEDGER-E09's tests, the rest about 5 s) against the 900 s verify cap; CONF-ENF-002 verified in 421 s, and the 20 s difference is almost all live_backend, which this packet does not touch. live_backend stays the first lever."]
deliverables: ["The TG-02 and TG-03 case ledgers and catalog, LEDGER-E09's reader guard tests, the I05 v3 supplement snapshot (manifest v2) and its TG-01 replay, the attestation and the chain record; one required verify from the owner-operated verifier."]
