contracts: ["Base is main 21ae371 (CONF-ENF-002). W04-3 of the adopted W04-0 plan: TG-02 (lifecycle, SOURCE_OWNER_IMPLEMENTATION, obligations E07, E09, E10, acceptance A02, A05, A06) at tests/enforcement/tg02_lifecycle/ and TG-03 (persistence, SOURCE_MULTIPROCESS_FAULT, obligations E10, E11, E12, acceptance A05, A06) at tests/enforcement/tg03_persistence/. One packet, branch and PR.","Owner decisions Q-T8, Q-T9, Q-T10 and Q-T11 (2026-10-13, via the lane monitor) are recorded verbatim in ownerDecisions above and in fixtures/ci/conf-enf-003-checkpoint.json.","Independence: the attestation tests/enforcement/attestations/conf-enf-003.json carries the plan's fields. The gated cases' expected results are the adopted contract vectors' own outputs and final snapshots. LEDGER-E09's subject is R12's own reader (src/harness_conformance/live_proxy_server.py, Q-T9): its source was read only to locate its factory-owned classes, guard state and cleanup rows, and every expected outcome comes from the plan's E09, E07 and A02 text; stand-ins replace only Linux-only or cryptographic steps in front of the guards under test (review R3-11). No R10 source, W03 work in progress or W05 build is read or run; the reader itself is unchanged.","Ledgers: tg02_lifecycle/results.json and tg03_persistence/results.json list each group's plan cases in plan order with phase, obligations, blockers, subject, result, reason, properties, evidence and catalog, and must equal what tests/enforcement/_catalog.py gives. LEDGER-E09 (the only W04_OFFLINE case) carries the property table of its reader guard tests (E09 and A02, one row per property, with the tests that show it); 13 of its 16 properties are PASS. The other three need the enrolled Linux host; each names the plan's W06 native cases that carry it and stays NOT_RUN_ENV_UNAVAILABLE, here and in those cases, outside this case's own scope (owner decision Q-T11), so LEDGER-E09 is PASS for its own scope (AGENTS rule 14 holds: nothing not run is reported as PASS). The carried properties and their cases, pinned by name and carrier in the tests (review R3-5): fixed factories on an enrolled Linux host (TG-05 MATRIX:original deadlines); the peer's kernel rechecks on each inspection tick, SO_PEERCRED credentials, pidfd liveness and the socket path (TG-04 MATRIX:parent/FD spoof, TG-05 MATRIX:peer death/restart); and the inspections' construction past their first native read with the BPF view's program ID recheck on cleanup (TG-04 MATRIX:parent/FD spoof, TG-04 MATRIX:effective BPF ancestors, TG-04 S8-KERNEL-FACTS, TG-05 MATRIX:peer death/restart) (reviews R2-3, R3-4). A test runs the evidence tests again and requires every one to pass with none skipped. The other 17 cases (14 AFTER_W05_RELEASE_SET, 3 W06_NATIVE_ONLY) are NOT_RUN_ENV_UNAVAILABLE, never PASS; the reason names the phase and any blocker (D-W02A-F2).","Catalog (Q-T8): every gated case is fixed now to the contract vectors that specify it, selected by rules over the vectors' own content in _catalog.py: the I05 v3 transcripts and agreement checks, the I07 v3 transcripts (with the policy writer's own analogues), the admission v3 claims (A1 with a stamp that is not the armed action's; A3 and A4) and the I05 v3 supplement. Examples: CE17, CE21 and CE22 by their transcripts' intents; S63 by the GET agreement checks that refuse a result attributed to another action and the transcripts the broker closes as RECONCILIATION_REQUIRED (HOST_INTERFACE_SPEC sections 6.2-6.3); CE18 by every outcome or final snapshot recording ADMITTED_BEFORE_INVALIDATION; ENOSPC, partial records and restart/rollback by injected storage failures, torn writes, failures part way through a transition, gate restarts, restart-marker failures and replayed executions. Each test pins anchor vectors and every selection exactly (size and digest of its id list). The executable source and the wire-level adapter that run these cases against W05's released build come with W05's release set, together with TG-01's CODEC case.","LEDGER-E09 tests (tg02_lifecycle/test_reader_guards.py), with expected outcomes from E09, A02 and the parts of E07 the reader's guards carry: over all eight factory-owned kernel views, custody ticks refuse a closed, failed or idle view, another process or thread, a clock before the last tick, a passed deadline, a foreign inspection owner, an unbound view while a server is installed and a subclass imitation; a busy view refuses a second phase, and a failure, a parent view's failure, a reentrant phase or an overrun deadline inside a phase leaves the view failed for good; the server's own inspection runs its phases in custody and refuses reentrancy, a replaced owned view, a changed server, binding, file owner or deadline, a phase past the server's deadline and a reader it does not own, all for good; a view built without its constructor is never usable, a binding whose load fails is poisoned for good, a half-built root view's native reads are still closed, and the fixed factories refuse a host outside their ABI; only the installed server, in its own process and thread, passes its owner check, no caller constructs a qualification binding, the self inspection takes its binding only from the installed server naming it, an observer or broker inspection refuses a peer or server slot not bound to it, and code, cgroup and BPF views are built only on their own idle parent view; on every observer and broker tick a substituted socket, pidfd, descriptor pin, parent, credentials, process identity, peer or server slot is refused; process, code and cgroup views hold only the fixed role set and their process view's role; the retained pidfd must stay the original, non-inheritable and alive; cleanup closes only original descriptors under substitution (seven views, the process view's pidfd, the server's files), skips rows never acquired, keeps its failure, and the inspection and the server close their retained originals, not substitutes. The trusted-code boundary and the two properties not run, with their carrying cases, are declared in the module and tested to be. Added in review round 3: every tick, reader-tick and phase guard of the server's own inspection (with its record, scope, authority, session and epoch sampling), the observer and broker inspections' clock, owner and binding checks and their construction checks, the server's retained files, and the qualification binding's recheck and construction (its Linux-only load and its signature verification are stand-ins). A mutation sweep that drops each condition of these guards leaves only survivors that are equivalent (a second guard refuses the same change) or Linux-only (carried).","I05 v3 supplement (Q-T10): the snapshot manifest moves to v2 with a per-file sourceCommit (a2eab93 for the plan's set and earlier additions, 93d32e1 for architecture/i05-gate-channel-v3-supplement/vectors.json and status.json, both also pinned by sha256 and size in test_bootstrap.py). TG-01 replays S01-S06 as the vector set (I05 gate channel v3, supplement), tagged transcript replay: the supplement must name the pinned v3 vectors and model, and each `equals` relation is checked on the data before the model's replay, which needs jsonschema, so all six are NOT_RUN_ENV_UNAVAILABLE under the profile. TG-03 maps them to its kill, ENOSPC, partial-record and restart/rollback cases.","History: one closed chain record fixtures/ci/conf-enf-003-checkpoint.json and its registry entry; no frozen-code change. Changed: test_bootstrap.py (manifest v2, the new area modules, the one subject import Q-T9), the TG-01 replays, ledger and tests (the supplement set, transcript replay for I05 at 126 vectors, the ledger's packet field, the stale ANCHORS comment of review R4-3), the README, and tests/ci_checkpoint/test_checkpoint_chain.py (the CONF-ENF-003 record test and registry entry 3).","No ci/ path changes and no new command: the 13 CONF-ENF-002 commands are inherited unchanged and in order; the inherited tests/enforcement discover argv runs the new tg02_lifecycle and tg03_persistence packages.","Budget: the full 13-command sandboxed run under Python 3.12.14 took 441 s on d58d77f (live_backend 391 s, linux_baseline 34 s, ci_checkpoint 6 s, tests/enforcement 5 s, the rest about 5 s) against the 900 s verify cap; CONF-ENF-002 verified in 421 s, and the 20 s difference is almost all live_backend, which this packet does not touch. Later review rounds change only the enforcement area's tests, catalog and ledgers; tests/enforcement grows to about 8 s (the reader guard tests run twice, once as LEDGER-E09's evidence rerun), so the expected total is about 445 s. live_backend stays the first lever."]
deliverables: ["The TG-02 and TG-03 case ledgers and catalog, LEDGER-E09's reader guard tests, the I05 v3 supplement snapshot (manifest v2) and its TG-01 replay, the attestation and the chain record; one required verify from the owner-operated verifier."]
