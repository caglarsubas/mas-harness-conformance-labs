objective: "R12's signers disclosure on the CONF-LINUX-001 path (owner decision Q-LHA-1 (a), 2026-10-23; Q-SG-6, Q-SG-7/8 and Q-SG-9, 2026-10-24), a precondition of LINUX-HOST-AUTH-001 before the first CONF-LINUX-001 run: one principal may hold the three separated keys of PLATFORM_RELEASE, TENANT_LIVE_EXECUTION and CAPACITY_OPERATOR when it says so. A closed signers value, INDEPENDENT_PRINCIPALS or SINGLE_PRINCIPAL_SEPARATED_KEYS, is signed into a v1alpha2 execution envelope, capacity authorization and Linux evidence record, which must agree, and selects the owner rule over the three selected trust keys: pairwise-distinct owners, none the reserved label single-principal, or all three the fixed label single-principal. Every distinct-key check and every signature stays; the v1alpha2 documents are signed over their own v1alpha2 domains; every shared validator, v1alpha1 schema and v1alpha1 document is unchanged, so every v1alpha1 refusal keeps its code and no other path admits v1alpha2."
