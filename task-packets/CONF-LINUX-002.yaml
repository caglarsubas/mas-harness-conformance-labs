ownerDecisions: [{"id":"Q-LHA-1","selected":"a","date":"2026-10-23","decision":"Q-LHA-1: \"Separated keys, disclosed (Recommended)\". The 'independent signers' clause joins the superseded set, and an R12 change follows for `signers: SINGLE_PRINCIPAL_SEPARATED_KEYS`."},{"id":"Q-SG-6","selected":"Allow, scoped","date":"2026-10-24","decision":"**Q-SG-6:** \"Allow, scoped (Recommended)\". An explicit exception to Q-T3 for CONF-LINUX-002 only: exactly src/harness_conformance/live.py (a separate v1alpha2 path, shared validators untouched) and linux_readiness.py change, through the packet's own chain record."},{"id":"Q-SG-7/8","selected":"Gate, your per-PR merge","date":"2026-10-24","decision":"**Q-SG-7/8:** \"Gate, your per-PR merge (Recommended)\". The three schemas/v1alpha2 files are gate material, v1alpha1 stays byte-identical, and the owner approves the R12 PR per head. Q-LHA-1 (a), Q-SG-6 and Q-SG-7 are the recorded public-contract decision, quoted in the packet's ownerDecisions."},{"id":"Q-SG-9","selected":"Design now, build after 008","date":"2026-10-24","decision":"**Q-SG-9:** \"Design now, build after 008 (Recommended)\". Design and review now; build and merge after MET-LINUX-008 merges, citing its merged record, and still before the first CONF-LINUX-001 run."}]
contracts: ["Base is R12 main c17bcfe32df26eab13844b73f65666bb0fa4e0a0 (CONF-MAS-005). One packet, branch and PR, built from the closed design revision 4 (sha256 e857138a61759619930060d4f84ed42a2177ed196b1cdd81d71a939d4abdb050), PASS_FOR_BUILD under the owner's cap \"Fold fixes, cap now (Recommended)\" (2026-10-24, relayed as MON-SG3-CAP); its binding build rules SG3-1 (what a changed capacity, trust bundle, envelope or record meets first) and SG3-2 (a record carrying signers under v1alpha1 or an unknown version takes today's path and is refused as UNKNOWN_FIELD) are checked first in the CONTRACT round.","The public authority (AGENTS.md line 3; Q-SG-9): harness-onion main 9184f5b636e6226c1b9040b54b90508966ca001b, where MET-LINUX-008 (LINUX-HOST-AUTH-001) merged. Its record architecture/linux-host-authority/host-authority.json (sha256 21c0a06202917afc10b5009a565340963404b998e917073fb1621736465bac77) carries the replacement predicate, whose disclosure is signers: SINGLE_PRINCIPAL_SEPARATED_KEYS, and names CONF-LINUX-002 as a precondition of the first CONF-LINUX-001 run.","The public-contract decision (AGENTS.md line 11, rule 9; Q-SG-8): owner decisions Q-LHA-1 (a), Q-SG-6 and Q-SG-7 together, relayed by the lane monitor and recorded verbatim in ownerDecisions above and in fixtures/ci/conf-linux-002-checkpoint.json, with Q-SG-9 for the order: built and merged after MET-LINUX-008, before the first CONF-LINUX-001 run.","Monitor rulings under the owner's 2026-10-22 delegation, cited here and not listed as owner decisions: MON-SG-1..5 (Q-SG-1..5: the id CONF-LINUX-002; the disclosure in the envelope, the capacity authorization and the evidence record; v1alpha2 on the CONF-LINUX-001 path only; CONF-LIVE-006 out of scope; one fixed role-free principal label); MON-R12-SIGNERS-SCOPE and MON-R12-SURVEY-OK; MON-SG-PKTID (a v1alpha2 envelope keeps packetId CONF-LINUX-001 and PACKET_DIGEST); MON-SG-DR1-KEEP and MON-SG1-NEXT (a) with SG1-3 (a); MON-SG-DR2-KEEP and MON-SG2-NEXT (a); MON-SG-DR3-KEEP; MON-CL2-GO; MON-CL2-ORACLE-PATH (tests/linux_signers/test_oracle.py is the ninth added path, for 14 allowedPaths); MON-CL2-ORACLE-R1-SLIPS; MON-CL2-C1-SLIPS; MON-CL2-C3-GO.","Gate material (Q-SG-7/8): the three added files schemas/v1alpha2/live-campaign-execution-envelope.schema.json, live-capacity-authorization.schema.json and linux-readiness-evidence.schema.json, each its v1alpha1 file with only the $id, the schemaVersion const and the closed signers member changed; the evidence schema's nested plan const stays linux-readiness-plan/v1alpha1. The v1alpha1 schemas stay byte-identical, and the owner approves the R12 PR per head.","The scoped src/ exception (Q-SG-6), for this packet only and through its own chain record: src/harness_conformance/live.py only gains lines (the v1alpha2 constants, SIGNERS, SINGLE_PRINCIPAL_OWNER, validate_envelope_v2, validate_capacity_v2, verify_live_signatures_v2 and verify_linux_authority_v2), and src/harness_conformance/linux_readiness.py gains SCHEMA_V2, DOMAIN_V2, RECORD_FIELDS_V2, the private _validate_linux_evidence_v2 and verify_linux_evidence's dispatch on the parsed record. Every shared validator, schema and domain stays byte for byte, so the preflight, CONF-LIVE-006's backend, the supervisor, schema.validate and the validate CLI keep refusing v1alpha2. src/ stays standard-library only.","R12's checkpoint chain (owner decision Q-T3 (a)): fixtures/ci/conf-linux-002-checkpoint.json is entry 12 of fixtures/ci/checkpoints.json (keep 13), after CONF-MAS-005's record (8fbe0f083ab213e76177877944eaf71ed822ed43d7b3e5e90ed788afb991311c). It names the 3 changed paths with their before-images at the base and the 9 added paths, each with an exact after-pin, and no deletion, so every inventory pin checks the tree with this packet projected back.","Owner decision D5a: tests/linux_signers/test_oracle.py (sha256 d2e4c9b4af9149d5bd13456612ce899ebe124ec0b4e5a696f82e5c5674d72607) holds oracle tests written outside the candidate by a separate agent from the design's preregistered behaviour, black-box, against a read-only export of the candidate's first commit; the operator added it as its own commit, and command 15 runs it in the verify (MON-CL2-ORACLE-PATH). Apart from the three schemas/v1alpha2 files, the packet changes no gate-material path (ci/, policies/, legal/, docs/harnesses/, verifier docs) and no probes/ or tests/enforcement/ path; fixtures/ci/ is R12's checkpoint-chain data.","The custody reading (design section 2; LHA-CN-2): owner labels are self-asserted in the trust bundles, so the disclosure's honesty rests on the owner's custody of the trust bundles, not on R12 code; docs/live-backend/signers.md states it, and docs/live-backend/linux-boundary.md stays byte-identical. Every result stays UNIT_VERIFICATION_ONLY with nativeAcceptance false."]
deliverables: ["The v1alpha2 signers path: live.py's additions and linux_readiness.py's private validator and dispatch; the three schemas/v1alpha2 files; the tests/linux_signers root (the v1alpha2 builder over the unchanged linux_baseline fixture, every design section 5 vector with its reason code, and the D5a oracle tests the operator added); docs/live-backend/signers.md; the chain-test record test, the chain record and its registry entry; one required verify from the owner-operated verifier."]
excluded: ["Any change to an existing shared validator, schema, domain or v1alpha1 document; any src/ change beyond live.py's additions and linux_readiness.py's dispatch and v1alpha2 additions (Q-SG-6); CONF-LIVE-006's adapter and live_backend_authority.py's owner rule; CONF-LINUX-001's packet and PACKET_DIGEST; any frozen-code change (the checkpoint helper, HELPER_SHA256); any ci/, probes/ or tests/enforcement/ path or other gate-material path beyond the three schemas/v1alpha2 files; any dependency (pyproject.toml, toolchain.lock); the harness-onion texts; any key, run, host, network, cloud or spend; W03 or R10 source; the owner's warm-start repositories."]
