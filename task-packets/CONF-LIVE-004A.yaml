ownerDecisions: [{"id":"Q-MEMFD-5","selected":"Scoped exception (Recommended)","date":"2026-10-28","decision":"Q-MEMFD-5 (owner, via the lane monitor): \"Scoped exception (Recommended)\". Its scope: one file, src/harness_conformance/live_linux_boundary.py, and only three changes: the memfd flags (MFD_NOEXEC_SEAL), the coded refusal CREDENTIAL_MEMFD_NOEXEC_UNSUPPORTED on kernels without it, and the F_SEAL_EXEC assertion. It closes W01-AMEND QW3 = M-a. The record's ownerDecisions cite Q-MEMFD-5 and QW3."},{"id":"W01-AMEND-QW3","selected":"M-a","date":"2026-10-10","decision":"W01-AMEND-QW3 (OWNER_DECIDED, as the snapshotted amendment states it): M-a, replacing a vm.memfd_noexec pin (which a CAP_SYS_ADMIN holder in the initial namespaces can lower): memfd_create flags become MFD_CLOEXEC | MFD_NOEXEC_SEAL, so the kernel clears exec and sets F_SEAL_EXEC on every call with no reliance on host state; carried by the W02d successor seccomp-allowlists-v2"}]
contracts: ["Base is R12 main bee5ad4f3d673aef496f1fd83956658a095dec8a (CONF-LINUX-002). One packet, branch and PR, under the lane monitor's GO (MON-R12-MEMFD-GO, steps 1-2; MON-R12-MEMFD-Q34, step 3).","The obligation: W01-AMEND O-SERVER-MEMFD, snapshotted in R12 at tests/enforcement/snapshots/harness-onion/architecture/host-interface-amendment-w02d/amendment.json (obligations[0]): call memfd_create with MFD_CLOEXEC | MFD_NOEXEC_SEAL instead of MFD_CLOEXEC | MFD_ALLOW_SEALING, and change its unit rig (tests/live_backend/test_linux_boundary.py:836-870) to expect those flags, before the code runs under the W02d v2 filter. The v2 allowlists admit memfd_create only with arg1 exactly MFD_CLOEXEC | MFD_NOEXEC_SEAL = 9.","The scoped src/ exception (owner decision Q-MEMFD-5, \"Scoped exception (Recommended)\", 2026-10-28, an exception to Q-T3's data-and-tests-only rule) for one file, src/harness_conformance/live_linux_boundary.py, and only three changes: (1) the memfd flags: module constants MFD_NOEXEC_SEAL = 0x0008 and F_SEAL_EXEC = 0x0020, each cited to linux v6.12 uapi (include/uapi/linux/memfd.h, include/uapi/linux/fcntl.h), an equality check wherever os or fcntl has the attribute, and memfd_create(..., os.MFD_CLOEXEC | MFD_NOEXEC_SEAL), never MFD_ALLOW_SEALING; (2) the coded refusal CREDENTIAL_MEMFD_NOEXEC_UNSUPPORTED when memfd_create fails with EINVAL, through the method's existing failure path, with no fallback, every other error keeping its behaviour; (3) the F_SEAL_EXEC assertion: right after creation F_GET_SEALS must include F_SEAL_EXEC, and the stored seal set row[\"seals\"] includes it with the four added seals, so the descriptor check asserts it too. It closes W01-AMEND-QW3 = M-a (owner, 2026-10-10).","Monitor rulings under the owner's 2026-10-22 delegation, cited here and not listed as owner decisions: MON-R12-MEMFD-GO (Q-MEMFD-1 and Q-MEMFD-2 pre-ruled: on a kernel without MFD_NOEXEC_SEAL refuse with a coded error and never fall back to ALLOW_SEALING; assert F_SEAL_EXEC in the seal-set check explicitly); MON-R12-MEMFD-Q34 (Q-MEMFD-3 (a): the client site and its rig only; Q-MEMFD-4 (a): module constants cited to linux v6.12 uapi, MFD_NOEXEC_SEAL = 0x0008 and F_SEAL_EXEC = 0x0020, with an equality check wherever os/fcntl has the attribute); MON-R12-MEMFD-PATHS (exactly the six allowedPaths); MON-R12-MEMFD-A (option A: no new test method names, the four checks as subTest cases inside two existing methods; the mismatch and missing-F_SEAL_EXEC refusals reuse CREDENTIAL_MEMFD_NOEXEC_UNSUPPORTED, inside Q-MEMFD-5's one named code); MON-R12-MEMFD-PKT1 (the PACKET r1 fold: LM-P1-1, another errno re-raised as OSError with its errno; LM-P1-2, a fifth subTest case memfd-stored-exec-seal; LM-P1-3, both server memfd sites :4046 and :4922 carried).","The unit rig (tests/live_backend/test_linux_boundary.py:836-875) requires flags == 9, starts each memfd with seals F_SEAL_EXEC (32) as the kernel does, and patches os.MFD_NOEXEC_SEAL and fcntl.F_SEAL_EXEC; the sealed memfd's final seals are 47. Under MON-R12-MEMFD-A no test method is added (tests/live_backend is a suite root whose test identities are pinned): four checks are subTest cases added to two existing methods, every existing assertion kept. test_partial_acquisition_exhaustion_and_write_failure_release_all gains EINVAL refused as CREDENTIAL_MEMFD_NOEXEC_UNSUPPORTED with no descriptor left open, another errno keeping its behaviour, a memfd whose seals lack F_SEAL_EXEC after creation refused, and an os/fcntl attribute that differs from the named constant refused; test_temporary_socket_and_sealed_memfd_close_before_receipt gains flags == 9, never 3, and (MON-R12-MEMFD-PKT1) memfd-stored-exec-seal: a ready memfd whose seals lose F_SEAL_EXEC is refused by the descriptor check as CREDENTIAL_MEMFD_CHANGED. The other-errno case asserts the OSError (EMFILE) is re-raised. Each added case fails on the base flags or with its src check removed (author mutation runs).","R12's checkpoint chain (owner decision Q-T3 (a)): fixtures/ci/conf-live-004a-checkpoint.json is entry 13 of fixtures/ci/checkpoints.json (keep 14), after CONF-LINUX-002's record (78345be6192cc895582ae3ea5ba1c5bbead56af6b635e384e736b2e9f92fea3d). It names the 3 changed paths with their before-images at the base and the 1 added path, each with an exact after-pin, and no deletion, so every inventory pin checks the tree with this packet projected back. No ci/, probes/, tests/enforcement/ or schemas/ path changes.","The carried server sites (Q-MEMFD-3 (a)): src/harness_conformance/live_proxy_server.py:4046 (\"planeon-api-identity\", rig tests/live_backend/test_proxy_server.py:7562-7566) and live_proxy_server.py:4922 (\"planeon-proxy-identity\", the SERVER identity memfd) both keep the old flags MFD_CLOEXEC | MFD_ALLOW_SEALING, fail closed under the v2 allowlist (arg1 must be 9), and move with the server to LINUX-PROBE-KIT-001 (owner Q-PK-2), which must meet the same rule (MON-R12-MEMFD-PKT1). This packet changes neither.","Every result stays UNIT_VERIFICATION_ONLY with nativeAcceptance false; src/ stays standard-library only."]
