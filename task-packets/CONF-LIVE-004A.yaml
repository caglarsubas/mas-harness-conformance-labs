id: "CONF-LIVE-004A"
repository: "mas-harness-conformance-labs"
branch: "codex/conf-live-004a-o-server-memfd"
objective: "R12's client sealed-credential memfd becomes non-executable (CONF-LIVE-004's prerequisite O-SERVER-MEMFD, harness-onion W01-AMEND; owner decision Q-MEMFD-5, 2026-10-28, closing W01-AMEND-QW3 = M-a, 2026-10-10), before the code runs under the W02d v2 seccomp filter. _LateResources.tls_memfd() in src/harness_conformance/live_linux_boundary.py calls memfd_create with MFD_CLOEXEC | MFD_NOEXEC_SEAL (9), the only flags the v2 allowlist admits, instead of MFD_CLOEXEC | MFD_ALLOW_SEALING (3), which that filter kills. A kernel without MFD_NOEXEC_SEAL (EINVAL) is refused with the coded error CREDENTIAL_MEMFD_NOEXEC_UNSUPPORTED and never falls back to other flags; the F_SEAL_EXEC seal the kernel sets is asserted right after creation and is part of the stored seal set that the descriptor check re-reads. The unit rig expects flags 9 and starts each memfd sealed F_SEAL_EXEC, as the kernel does."
