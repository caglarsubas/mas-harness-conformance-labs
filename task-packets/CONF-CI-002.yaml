contracts: ["Base is main 9766c9cb02383968499a109c36f4b7a18ec532b0 (CONF-CI-001), whose pre-bootstrap predecessor is 3a81c8ffb17be9e288c4368d443c57361d5a4fc8. One packet, branch and PR.","Owner decisions Q-M = M1 and D1-D5 (2026-10-11, via the lane monitor) are recorded verbatim in ownerDecisions above and in fixtures/ci/conf-ci-002-checkpoint.json.","fixtures/ci/conf-ci-002-checkpoint.json is a closed record naming every path CONF-CI-001 and CONF-CI-002 deleted, changed or added, with exact after-pins (mode, size, sha256) and 3a81c8f before-images and pins. Its digest is pinned in tests/platform/linux_baseline/_successor_inventory.py (CI_002_RECORD_SHA256); that helper's and tests/live_backend/_inventory.py's after-pins are taken with their digest constant zeroed, to break the pin cycle.","tracked_inventory (D1) checks the current tree against the record's after-pins first and then hands every older consumer the 3a81c8f view of the named paths: the deletion restored, the changed paths restored to their before-images and modes, and the additions and the record removed. Every path the record does not name passes through unchanged, for the older layers' own pins. No older record, digest or test identity changes; only HELPER_SHA256 moves, by the PERF-004 constant rule.","test_linux_inventory.py reads modes and presence from that checked view (D2). The deletion of .github/workflows/verify.yml and the 100644 to 100755 modes of ci/network_canary.py and ci/run_packet_argv.py are admitted (D3). The checkpoint's own tests live in the new root tests/ci_checkpoint/; no test method is added to or removed from the six existing roots (D4). The rewritten runner_boundary, zero-bill and parity tests are accepted on the record's exact after-pins plus independent review (D5).","runner_boundary now describes the adopted harness-onion contract: the canary proves isolation only by its backend's own denial errno (linux-firejail also accepts ENETUNREACH and EHOSTUNREACH), accepts it at socket creation, settimeout or connect alike, reads only HARNESS_OFFLINE_BACKEND (the bridge requires HARNESS_OFFLINE_ENFORCED=1 and the wrapper a session ID), refuses an absent or unrecognized backend before any socket, and under trusted outer isolation the launcher, not the wrapper, binds the backend to the operating system. The retired R12 runner's stricter rules (route and DNS errors never proof on Linux; the denial stage bound per backend; session and enforcement markers and OS-to-backend binding checked in the canary) are not properties of the adopted contract.","ci/zero_bill.py accepts zero workflows (the owner-operated verifier replaced the pinned workflow, VX4) and still checks any single workflow fully; more than one is refused. tests/parity/test_packet_runner.py captures the legacy runner's evidence-format lines, so no packet=, offline-acceptance or prefetch line reaches a verify log from a test.","ci/targets/conf-ci-002.json (AGENTS rule 13: this packet's own descriptor) runs each migrated suite through ci/run_make_target.py, which sets PYTHONPATH=src. ci/zero_bill.py and ci/targets/conf-ci-002.json are offline-transport paths: the owner approves this exact head before the verify.","The 4 CONF-CI-001 commands are inherited unchanged and in order; 8 commands are appended. Measured through the real wrapper under a deny-network sandbox at this packet's head: all 12 commands in about 420 s (live_backend about 380 s), against the verifier's 900 s cap."]
deliverables: ["The checkpoint record and layer with its tests, the migrated suites and the descriptor; one required verify from the owner-operated verifier under the owner's transport approval."]
