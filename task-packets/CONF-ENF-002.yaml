contracts: ["Base is main 83d2c55 (CONF-ENF-001). W04-2 of the adopted W04-0 plan: TG-01 (contract, OFFLINE_CONTRACT, obligations E04, E06, E07, E10, E11, acceptance A06) at tests/enforcement/tg01_contract/. One packet, branch and PR.","Owner decisions Q-T4, Q-T5, Q-T6 and Q-T7 (2026-10-11, via the lane monitor) are recorded verbatim in ownerDecisions above and in fixtures/ci/conf-enf-002-checkpoint.json; Q-T4 and Q-T5 also in tests/enforcement/toolchains.json.","Independence: expected results are the adopted contracts' own vectors; the reference models are the contracts' snapshotted models, loaded only through tests/enforcement/_models.py from manifest-pinned bytes (a model runs from its pinned bytes, after its pinned siblings). No implementation, R10 source or W03 work in progress is read or run. The attestation tests/enforcement/attestations/conf-enf-002.json carries the plan's fields.","Every vector is replayed in full. Under Q-T4 a vector whose replay reaches the jsonschema import (G-JSONSCHEMA) is counted NOT_RUN_ENV_UNAVAILABLE and never PASS; any other difference fails. tests/enforcement/tg01_contract/results.json is the ledger each verify must reproduce exactly (per vector set: counts and the not-run vector ids), produced under the verifier's python-conformance-stdlib profile. A test fails if jsonschema becomes available, so the ledger is redone, never stale. CODEC is NOT_RUN_ENV_UNAVAILABLE until W05's release (AFTER_W05_RELEASE_SET).","Case mapping (the ledger's cases field): MATRIX exact fields, duplicate/unknown keys, role/version mismatch, transcript replay and wrong peer onto the I05 v3, I07 v3, admission v3, SELinux v4 and seccomp v2 vector sets and native v3; CE23 onto the I07 v3 kind checks (a Pod is refused EFFECT_KIND, a kind outside the table KIND_OUTSIDE_TABLE); CONTRACT-DATA onto SELinux v4, seccomp v2, I06 v2 and the W01 amendment W02D (its reference check over the amendment record, the W01 base, the published effective specification and W02d's carried items, all read from pinned snapshots).","Q-T5: scripts/i06_backend_profile.py is snapshotted from a2eab93 as a recorded addition to the plan's contract set (closes G-I06-V1); the I06 v2 model still cannot load without jsonschema. Q-T7: the W01 base architecture/host-interface-inputs/resolved/HOST_INTERFACE_SPEC.md (sha256 8a3a09bb…, the plan's own sources pin and the W02D model's BASE_SHA256) and architecture/seccomp-allowlists/status.json (W02d's carriedToW01) are snapshotted from a2eab93 as recorded additions, so the W02D check reads only pinned bytes. Q-T6: the I05 v3 supplement is left to a later W04 packet.","History: one closed chain record fixtures/ci/conf-enf-002-checkpoint.json and its registry entry; no frozen-code change. tests/enforcement/test_bootstrap.py is changed (the recorded additions, the area-local modules, the one path loader _models.py, review E3-1 and E3-2 on the best-effort import detector, and attestation digests checked against their own packet's record). tests/ci_checkpoint/test_checkpoint_chain.py is changed: its forged-record test now forges the newest registered record (it assumed CONF-ENF-001 was the newest) with record-scoped refusals anchored to that record's packet id, and it gains a test that a re-pinned earlier record is refused at its successor's predecessor pin and a CONF-ENF-002 record test (data and tests only: no frozen helper, no ci/ path, no deletion).","No ci/ path changes and no new command: the 13 CONF-ENF-001 commands are inherited unchanged and in order; the inherited tests/enforcement discover argv runs the tg01_contract package.","Budget: the full 13-command sandboxed run under Python 3.12.14 took 422 s on this packet's tree (live_backend 377 s, linux_baseline 34 s, ci_checkpoint 5 s, tests/enforcement 4 s including all TG-01 replays, the rest about 2 s) against the 900 s verify cap; CONF-ENF-001 verified in 417 s. live_backend (about 89%) stays the first lever for later W04 packets."]
deliverables: ["The TG-01 replays, their results ledger and loader, the recorded snapshot additions, the attestation and the chain record; one required verify from the owner-operated verifier."]
excluded: ["Any frozen-code change (the checkpoint helper, HELPER_SHA256), any ci/ path or new command, any dependency; any W05 implementation (CODEC waits for W05); the I05 v3 supplement (Q-T6); W03 or R10 source; live, native or networked execution."]
