ownerDecisions: [{"id":"RESUME-2","selected":"a","date":"2026-10-14","decision":"\"Move to W04-5/W04-6\": the lane moves on to W04-5 (TG-06/TG-07 backend and cleanup tests) or W04-6 (TG-08 compatibility and migration). W04-4b stays open; its TG-04 probe source needs a human author or a later decision."},{"id":"Q-T20","selected":"a","date":"2026-10-14","decision":"record S44 now, property by property; each mapped vector replays where the verifier profile can run it, otherwise NOT_RUN_ENV_UNAVAILABLE under Q-T4 (as TG-01); S44 turns PASS by regenerating the ledger once the jsonschema root bundle lands, with no source change."},{"id":"Q-T21","selected":"a","date":"2026-10-14","decision":"packet id CONF-ENF-007; CONF-ENF-006 stays reserved for W04-4c."},{"id":"Q-T20-ACK","selected":"acknowledged","date":"2026-10-14","decision":"\"Acknowledged\". The corrected Q-T20 path stands: S44 turns PASS once the jsonschema root bundle lands and TG-01's native v3 replay is written with its missing inputs; TG-08 then needs only its ledger regenerated, with no TG-08 source change."}]
contracts: ["Base is main 09a7652 (CONF-ENF-004). W04-6 of the adopted W04-0 plan: TG-08 (compatibility, SOURCE_AND_INSTALLED_MIGRATION, obligations E07, E10, E11, acceptance A06) at tests/enforcement/tg08_compatibility/, its source and installed parts kept separate. W04-4b (CONF-ENF-005, the TG-04 probes) and W04-4c (CONF-ENF-006, product fault injection) stay open (owner decision RESUME-2). One packet, branch and PR.","Owner decisions RESUME-2, Q-T20, Q-T21 and Q-T20-ACK (2026-10-14, via the lane monitor) are recorded verbatim in ownerDecisions above and in fixtures/ci/conf-enf-007-checkpoint.json.","Independence: the attestation tests/enforcement/attestations/conf-enf-007.json carries the plan's fields; its input digest is the snapshot manifest as CONF-ENF-004 left it (unchanged here), read by test_bootstrap as the latest record that pinned it. Expected results come only from the pinned contracts: the native qualification v3, I06 backend profile v2 and I05 gate channel v3 vectors' own refusals and outcomes, and the plan's S44 case text (W02D section 4.4). No R10 source, W03 work in progress, W05 build or R12 reader source was read or run; no replay was written or changed.","Ledger: tg08_compatibility/results.json lists the plan's five TG-08 cases in plan order, each with `part` SOURCE or INSTALLED, and must equal what tests/enforcement/_catalog.py gives. S44 (W04_OFFLINE) names the native qualification v3 reference model as its subject and lists one property per item of the plan's S44 case (another version refused with no fallback; missing EFFECT_GATE; an extra role; the gate under the BROKER key or path; an aliased role path; a lifecycle subject inside a resident role cgroup; unknown backendComponents keys), each served by the S44 catalog rows whose basis starts with it. A property is PASS only when every one of its vectors replayed and passed in the run, and the table is derived from that replay (Q-T20): the native v3 model imports jsonschema, so every property is NOT_RUN_ENV_UNAVAILABLE under Q-T4, and S44 turns PASS once the jsonschema root bundle lands and TG-01's native v3 replay is written with its missing inputs, after which TG-08 needs only its ledger regenerated (Q-T20-ACK). A run that gains jsonschema errors until then, so the ledger cannot go stale. The three MATRIX cases are AFTER_W05_RELEASE_SET (Q-T8) and INSTALLED is W06_NATIVE_ONLY (D-W02A-F2); all four are NOT_RUN_ENV_UNAVAILABLE, never PASS (AGENTS rule 14).","Catalog: rules over the vectors' own content in _catalog.py, with anchors and exact selection pins in the tests. S44: every native v3 cross-version case and the negatives refused as not a v3 record or whose intent names an earlier version (R01, R07, C31, V29); the deletion of EFFECT_GATE; an added role; a gate or broker path field set to the other role's value; the role-path aliasing refusals and every record negative setting a role's path field to another role's value; the lifecycle subjects' cgroup path and placement refusals and the captures of a resident role cgroup gaining a lifecycle subject's process or label (C14, C15, C30); the unknown backend component. Old profile rejection: native v3 cross-version and earlier-version negatives, I06 v2 cross-version and other-version refusals, I05 v3 frames and configuration refusals of an earlier version. New profile missing gate/backend: the role-set, backend-component and one-capture refusals, the gate/broker path rows and the I06 v2 component-set refusals. Export/upgrade/rollback without nonce reuse: every native v3 migration case, the v3-under-v2 cross-version cases a rollback meets, the I05 v3 BIND refusals of a replayed execution or reused manifest across an upgrade or rollback (W02D 5.5 M1, M3), and the configuration refusal of v1-shaped data. INSTALLED repeats exactly the three source MATRIX cases' rows.","Three design review rounds before the build: round 1 (3 MAJOR, 5 MINOR) and round 2 (2 MINOR) CHANGES_REQUIRED and fixed, round 3 PASS_FOR_BUILD with NOTEs; the round-3 wording NOTEs are applied, and the open items it names are carried (below).","History: one closed chain record fixtures/ci/conf-enf-007-checkpoint.json and its registry entry (entry 5, after CONF-ENF-004); no frozen-code change. Changed: _catalog.py (the TG-08 rules, the per-group rule text, the `part` field, S44's case subject, and the gap reason, which states a shared reason once; TG-02 to TG-05 ledgers unchanged), test_bootstrap.py (the tg08_compatibility area module; an unchanged attestation input is read from the latest record that pinned it), the README and tests/ci_checkpoint/test_checkpoint_chain.py (the CONF-ENF-007 record test and registry entry 5). Added: the tg08_compatibility package (ledger and tests), the attestation and this packet YAML.","No ci/, src/, probes/ or snapshot path changes and no new command: the 13 CONF-ENF-004 commands are inherited unchanged and in order; the inherited tests/enforcement discover argv runs the new tg08_compatibility package.","Budget: CONF-ENF-004 verified in 429 s against the 900 s verify cap; this packet adds only stdlib TG-08 tests (tests/enforcement grows by about 1 s), so the expected total is about 430 s. live_backend stays the first lever.","Carried open items (design review round 3 NOTEs): no adopted contract vector names an export, or a record-side nonce reused after a rollback, so those tests come with W05's release set and W06; a backend component placed at a role's cgroup path (native v3 R60) is read as the backend rules', not an aliased role path; the ledger's `vectors` field sums the catalog rows' sizes, as in TG-02 to TG-05, so a vector listed under two rows counts twice."]
deliverables: ["The TG-08 case ledger and catalog with S44's property table, the TG-08 tests, the attestation and the chain record; one required verify from the owner-operated verifier."]
excluded: ["Any frozen-code change (the checkpoint helper, HELPER_SHA256), any ci/ path or new command, any dependency or snapshot change; any change to the R12 reader (src/) or the probe workspace; TG-01's native v3 and I06 v2 replays and their missing inputs (with the jsonschema root bundle, Q-T4, Q-T20-ACK); the TG-04 probes (CONF-ENF-005) and product fault injection (CONF-ENF-006); W05's source tests and W06's installed run; W03 or R10 source; live, native or networked execution."]
