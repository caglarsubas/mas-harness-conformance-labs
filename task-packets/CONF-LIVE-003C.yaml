r the closing section. Every KEPT_R12 and MOVED_RETAINED path is byte-unchanged from the base.","Row classes: HISTORY for LOCAL_AND_CI_PASS_RECORDED and LOCAL_PASS_RECORDED; MOVED (owner LINUX-PROBE-KIT-001) for the four server rows at IMPLEMENTED_NOT_ACCEPTED and the ONGOING native inspector / broker / API row; KEPT_R12 for checkpoint / transport; CLIENT_CLOSED_HERE for required CI and source completion / merge / exact-main, whose moved remainder goes with the kit. No moved row changes status.","The proxy.md section is appended after the file's last byte; the base bytes stay an exact prefix, after the CONF-PERF-006 proof block, which the checkpoint chain projects back to its before-image.","R12's checkpoint chain (owner decision Q-T3 (a)): fixtures/ci/conf-live-003c-checkpoint.json is entry 14 of fixtures/ci/checkpoints.json (keep 15), after CONF-LIVE-004A's record (248e520d1e9761a7f7c627be5a9f63f4183a0b526af6f3b797cf9358acea99ee). It names the 2 changed paths with their before-images at the base and the 2 added paths, each with an exact after-pin, and no deletion. No src/, ci/, probes/, tests/enforcement/ or schemas/ path changes.","Every result stays UNIT_VERIFICATION_ONLY with nativeAcceptance false."]
