estly and keep the bounds. The ledger shows C2 FAILing duplicated work only, and test_ledger asserts the ledger as recorded. The README and the PR state it as packet 1's finding: under 25% poisoning, revision exhaustion wastes about 13% of work at p95. Carry the worker/coordinator retry policy to packet 2 or a successor as a named item."}]
contracts: ["Base is main d024a03 (CONF-ENF-009). MAS-RA-010 packet 1: an offline, standard-library simulation of the harness-onion multi-agent rules under four adversarial classes (peer injection, poisoned tool results, replay and stale versions, claim conflicts), with a ledger reproduced byte for byte and seed-distribution gates. One packet, branch and PR.","Owner decisions Q-NX-1..6, Q-MAS1-1, Q-MAS1-2, Q-MAS1-3, Q-MAS1-REV2 and Q-MAS1-F1 (2026-10-19, relayed by the lane monitor) are recorded verbatim in ownerDecisions above and in fixtures/ci/conf-mas-001-checkpoint.json. Q-MAS1-REV2 supersedes Q-MAS1-3's 28 of 32: every control must fire in all 32 seeds. These ids are this packet's; they are not MAS-RA-001's Q-MAS1-A..C.","Clean room (Q-NX-2, Q-NX-6): the rules are restated in R12's own words from harness-onion main 35b733b523f46b2ccba095ea046efe5d42bfa583 (topology-coordination, agent-loop, run-manifest and verdict-ledger). tests/mas/contracts.json pins the nine source files by sha256 and size. No bytes are copied, so there is no edge record. The owner's warm-start repositories, R10 source and W03 work in progress are not read (tests/mas/attestation.json).","An independent test campaign (HO-D2): CONF-MAS-001 is an input to CONF-A3-001, not a gate, and makes no product or scope decision. A PASS does not lift topology-coordination's denial of agents with conflicting objectives (Q-M4-10 (a)); the selection-threshold measurement stays open.","Acceptance argv 14 (Q-MAS1-1): python3 -m unittest discover -s tests/mas -p test_*.py, after the 13 inherited commands, which are kept in order. No ci/ path changes, so the head needs no transport approval.","Gates (Q-NX-4, Q-MAS1-2, Q-MAS1-REV2), over 32 seeds per class: zero tolerance in the defended runs for every own counter and for leakedSecrets, doubleMerge, nonHolderAccepted, unexplainedDuplicate and unclaimedWork, with every scheduled event delivered, reached and engaged; duplicated work p50 <= 50,000, p95 <= 100,000, max <= 250,000 ppm; lost work p50 0, p95 <= 125,000, max <= 250,000 ppm; completion p50 1,000,000, p95 >= 875,000, min >= 750,000 ppm; the 10 controls fire through their events in 32 of 32 seeds and the 4 depth checks hold in 32 of 32. All parameters are preregistered in tests/mas/classes.json; a failing gate is reported, not retuned.","Results recorded as they came (Q-MAS1-F1 (a), owner; Q-MAS1-F2 and Q-MAS1-F3 (a), lane monitor; 2026-10-19): C1, C3 and C4 PASS every gate; C2 FAILs its duplicated-work p95 only (133,333 ppm against 100,000: under 25% poisoning, revision exhaustion wastes about 13% of work at p95), and the bounds are kept. test_ledger asserts the ledger as recorded. F2 aligned the worker with the design's reviewed text (a board operation other than RENEW waits on an unanswered RENEW; a STALE_VERSION MERGE revises; NOT_HOLDER abandons) without changing a parameter, a bound or a gate result. F3 replaced the design's \"exactly one C3 duplicate per seed\" reading with \"E1's explained duplicate is present in every seed\" (seed 8 has 5, a holder's own RENEW overtaking its MERGE). Carried as MAS1-CARRY-1 to packet 2 or a successor: the worker and coordinator retry policy."]
deliverables: ["The tests/mas area: the preregistered classes.json, the harness (_sim.py), the classes and extractors (_classes.py), the ledger builder (_ledger.py), the ledger results.json with C2's recorded finding, four test modules, the contract pins, the attestation and the README; the chain-test record test and the chain record; one required verify from the owner-operated verifier."]
excluded: ["Any frozen-code change (the checkpoint helper, HELPER_SHA256), any ci/ path, any dependency (pyproject.toml, toolchain.lock); any change to src/, probes/, tests/enforcement/ or an existing ledger; any change to a bound or parameter after the first results; packet 2's classes (collusion, exfiltration, exhaustion, agent loss, deadlock, merge correctness) and the CONF-A3-001 record; the selection-threshold measurement and lifting the conflicting-objective denial; real models, networks, processes, clouds or tenants; W03 or R10 source; the owner's warm-start repositories."]
