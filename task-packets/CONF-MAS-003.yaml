contracts: ["Base is main c672aad (CONF-MAS-002). MAS-RA-010 packet 3, the resilience half: classes C8 (agent loss and partial observability: a holder crash, a lost answer to the coordinator, a coordinator restart resuming stale assignments), C9 (deadlock and livelock: an instructed wait cycle, a revision livelock; a relay cycle measured, ungated) and C10 (merge correctness: a superseded verdict, stale bytes after a revision, two racing merges, a merge after expiry) on the same offline, standard-library harness, plus the MAS1-CARRY-1 worker-policy arms (ungated), event-scoped depth engagement, P1-8 and the CONF-A3-001 campaign record, with the ledger reproduced byte for byte. One packet, branch and PR.","Owner decisions Q-NX3-1..6, Q-D3-1 and Q-R5-CAP (2026-10-20), relayed by the lane monitor, are recorded verbatim in ownerDecisions above and in fixtures/ci/conf-mas-003-checkpoint.json. The design closed after round 5 under Q-R5-CAP, with round 5's findings folded into binding build rules B5-1..B5-4.","Clean room (Q-NX-2, Q-NX2-3, Q-NX3-4): the rules are restated in R12's own words from harness-onion main 585364b94e3e4a8bf1418ef750ce3d71cd38f95a. tests/mas/contracts.json pins ten source files by sha256 and size; all ten are byte-identical at 27c54605, packet 2's pin. No bytes are copied, so there is no edge record. The owner's warm-start repositories, R10 source and W03 work in progress are not read (tests/mas/attestation-p3.json).","An independent test campaign (HO-D2): CONF-MAS-003 is an input to CONF-A3-001, not a gate, and makes no product or contract decision (Q-NX2-4 (a)). The arms are ungated comparative measurements; packet 1's baseline policy stays the gated one. tests/mas/campaign-record.json is the CONF-A3-001 input record.","Packets 1 and 2's seven ledger rows are byte-identical to CONF-MAS-002's; acceptance argv 14 is unchanged (Q-NX3-6 (a)). C9's duplicated-work bound is preregistered as an expected FAIL (Q-D3-1 (a)): its own events' explained duplicates fail the p50 and p95 sub-bounds; build-time finding F-C9-3 adds a second cause, packet 1's carried MAS1-CARRY-1 revision exhaustion on a clean claim in seeds 1, 8, 16 and 27, and that cause alone drives the max sub-bound breach (MON-F-C9-3-RECORD). The bounds and parameters are unchanged.","Owner decision D5a: tests/mas/test_oracle_p3.py holds oracle tests written outside the candidate by a separate agent from the design's preregistered behaviour, black-box; the same agent made the three preregistered scoping edits to tests/mas/test_oracle_p2.py. The packet changes no gate-material path (ci/, schemas/, policies/, legal/, docs/harnesses/, verifier docs); fixtures/ci/ is R12's checkpoint-chain data."]
deliverables: ["The tests/mas area extended: classes.json with C8 to C10, DECENTRALIZED_C9, sched-c8 and the arms; the harness rules (crashes, the drops-gated coordinator retry, coordinator restart and resumption, the wall-clock budget, the revision bound, the bypasses EXPIRY, WALL_CLOCK, REVISION_BOUND, SINGLE_MERGE, HOLDER, WORK_VERDICT and SUPERSESSION, the run parameters arm and until_deadline), the scenarios, scripted agents and extractors (three new counters, P1-8, per-event engagement), the ledger with C9's recorded FAIL, C8's and C9's ungated measurements and the ungated arms, the CONF-A3-001 campaign record, the re-pinned contracts and packet 3's attestation, packets 1 and 2's preregistered test edits, two packet-3 test modules, the oracle tests written outside the candidate (D5a) with the oracle agent's three scoping edits to packet 2's oracle file, and the README; the chain-test record test and the chain record; one required verify from the owner-operated verifier."]
excluded: ["Any frozen-code change (the checkpoint helper, HELPER_SHA256), any ci/ or other gate-material path, any dependency (pyproject.toml, toolchain.lock); any change to src/, probes/ or tests/enforcement/; any change to a bound or parameter after the first results; gating an arm or changing packet 1's baseline policy; any product or contract change (Q-NX2-4 (a)); lifting the conflicting-objective denial; real models, networks, processes, clouds or tenants; W03 or R10 source; the owner's warm-start repositories."]
