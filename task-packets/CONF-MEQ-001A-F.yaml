ownerDecisions: [{"id":"OWNER-ISSUE-TRACKING","selected":"AS_RELAYED","date":"2026-11-05","decision":"Owner, 2026-11-05 (issue tracking, relayed by the lane monitor): \"our sessions can accept, partially accept or reject the issues and implement code changes according to their decisions\". R12 issue 38 (P2, MEQ request deadlines during slow-drip HTTP reads) was dispositioned ACCEPT under this rule, and this packet implements the change."}]
contracts: ["Base is R12 main b4bbea795e5a61d4ddc1815ddb8b0b58c2fe23b3 (CONF-MEQ-001A). One packet, branch and PR, under the lane monitor's GO for CONF-MEQ-001A-F as a standalone packet (2026-11-05), after R12 issue 38 was dispositioned ACCEPT under the owner's issue-tracking decision.","Lane-monitor rulings under the owner's 2026-10-22 delegation, cited here and not listed as owner decisions: MON-R12-L3F-DEFER (fold LM-P3-2 into the next R12 packet that changes test_checkpoint_chain.py) with the rule text of VIS-L3F-1-2; Q-MEQAF-1 (a), fold it in this packet; Q-MEQAF-2, the record's decision row is the owner's issue-tracking decision; Q-MEQAF-3 (a), the client may import io.","The request deadline: the client sets one monotonic absolute deadline, request_timeout_s from the start of the request and before the factory opens the connection. The connection's socket is a deadline view of the factory's socket whose public methods are exactly the ones http.client uses on it, sendall, makefile('rb') and close; the view's own raw reader calls its private _recv_into, one receive per raw read, and sendall is a loop of sends. Each send and each receive first sets the socket timeout to the time left and raises TimeoutError once none is left. The client reports that as MEQ_READ_TIMEOUT, except while it reads the error body of an answer that is neither 2xx nor 3xx, which it reads best-effort for every such status: that answer keeps the code its status gives (MEQ_HTTP_CLIENT_ERROR for 4xx, MEQ_HTTP_SERVER_ERROR for 5xx, MEQ_PROTOCOL_ERROR for any other status) with its status and no body, as before this packet. The view's close leaves the factory's socket to the exchange, which closes it on every path. Between operations the exchange still refuses a request past its deadline with MEQ_READ_TIMEOUT.","Unchanged: the fixed parameters, the guard, the closed error set of 24 codes and each code's meaning, the evidence record, successful responses, error classification, resource cleanup and the documented cancellation behaviour (the cancel hook is polled before each event line; immediate cancellation stays with CONF-MEQ-001B). The connect phase, a TLS handshake in the default factory included, stays under the 2 s connect timeout per operation. The client imports only http.client, io, ipaddress, json, socket and time (Q-MEQAF-3 (a)) and never names the module that ci/zero_bill.py forbids in src/.","Regressions in test_client.py, over socket.socketpair() only: a trickling peer that sends one byte per 0.1 s gap, or reads 64 KiB per gap, for at least 100 gaps, holds in turn the status line and headers, a fixed-length, a chunked and a close-delimited body, an event line with a fixed length, a chunked event line, the request body, and the error bodies of a 404 and a 600 answer. Each exchange must fail no earlier than its 0.3 s deadline less 0.02 s and before 2.3 s, with MEQ_READ_TIMEOUT and no status, or for the 404 with MEQ_HTTP_CLIENT_ERROR, status 404 and no body, or for the 600 with MEQ_PROTOCOL_ERROR, status 600 and no body; the trickle must be cut short, the client's end closed, and the peer must see the close within the same bound. The idle-peer timeout test's bound is its deadline plus 2 s (it was 5 s).","LM-P3-2 (MON-R12-L3F-DEFER; VIS-L3F-1-2): every module that carries an ast coupling pin (today src/harness_conformance/live_supervisor.py only) keeps (a) `return proxy` only directly inside the one module-level _fixed_credential_proxy, (b) every use of _fixed_credential_proxy as a direct call's function, and (c) the client module name only in its one `proxy.__name__ ==` comparison, and it refuses importlib (any submodule, import_module and util included) and __import__. Seven mutants appended to the supervisor's source each break exactly their own rule (the mutation proof: a, b, c-name, three importlib shapes and one __import__ shape). This packet's merge record marks LM-P3-2 CLOSED.","R12's checkpoint chain (owner decision Q-T3 (a)): fixtures/ci/conf-meq-001a-f-checkpoint.json is entry 16 of fixtures/ci/checkpoints.json (keep 17), after CONF-MEQ-001A's record (de721f7f9ff219d503d2502d41511a923fd65ced7c2f480ee3076e0cb37b32c5). It names the 4 changed paths with their before-images at the base and the 1 added path, each with an exact after-pin, and no deletion. No src/, ci/, probes/, tests/enforcement/ or schemas/ path changes, and SUITE_ROOTS is untouched.","Every result stays UNIT_VERIFICATION_ONLY with nativeAcceptance false."]
deliverables: ["The deadline view in tests/model_endpoint/_client.py, the trickling-peer regressions and the tighter idle-peer bound in test_client.py, and the README's deadline section; the LM-P3-2 hardening with its mutation proof, the record test and the value[16] registry assertion in tests/ci_checkpoint/test_checkpoint_chain.py; the chain record and its registry entry; this packet YAML with the 16 inherited acceptance commands and no new one; one required verify from the owner-operated verifier."]
excluded: ["Any change to the client beyond the deadline: the fixed parameters, the guard, the error set, the evidence record and the cancellation hook; immediate cancellation, the PI-D1 mapping, TLS to localhost and the probe rows (CONF-MEQ-001B, after MEQ-CAMPAIGN-CONTRACT); any run against any endpoint and any socket in tests other than socket.socketpair(); any src/ hunk or path; any new acceptance command; every gate-material path (ci/, policies/, legal/, docs/harnesses/, verifier docs), probes/, tests/enforcement/ and schemas/; CL2-P3-2 (the next packet that touches linux_readiness.py); any native, installed or tenant claim."]
