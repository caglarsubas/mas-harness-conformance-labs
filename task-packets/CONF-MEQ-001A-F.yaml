branch: "codex/conf-meq-001a-f-deadline"
objective: "Close R12 issue 38 (P2) as data and tests: the test-local MEQ client, tests/model_endpoint/_client.py, bounds the whole exchange by its request deadline. A deadline view of the factory's socket arms every send and every receive with the time left to one monotonic absolute deadline, so a peer that trickles bytes can no longer hold the status line, a header, a fixed-length, chunked or close-delimited body or a server-sent-event line past it; the exchange ends at the deadline with the connection closed, reported as MEQ_READ_TIMEOUT (an answer that is neither 2xx nor 3xx and whose error body is cut short keeps the code its status gives, with its status and no body, as before). Offline socketpair regressions cover each path. The packet also folds LM-P3-2's supervisor coupling hardening into tests/ci_checkpoint/test_checkpoint_chain.py (MON-R12-L3F-DEFER; Q-MEQAF-1 (a)). No endpoint is contacted. Data and tests only: no src change."
predecessors: ["CONF-MEQ-001A"]
