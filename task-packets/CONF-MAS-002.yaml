ownerDecisions: [{"id":"Q-NX2-1","selected":"a","date":"2026-10-19","decision":"Q-NX2-1 (a): MAS-RA-010 packet 2 in R12 now; SUPPLY-QUARANTINE-001's plan for a later harness-onion slot."},{"id":"Q-NX2-2","selected":"a","date":"2026-10-19","decision":"Q-NX2-2 (a): packet 2 is the security half (C5–C7 plus the gateway conditions); packet 3 is the resilience half (C8–C10, the MAS1-CARRY-1 arms, event-scoped engagement, the CONF-A3-001 record)."},{"id":"Q-NX2-3","selected":"a","date":"2026-10-19","decision":"Q-NX2-3 (a): re-pin at the current harness-onion main at design time (27c5460 or later), covering packet 1's nine files plus the contracts the new classes restate."},{"id":"Q-NX2-4","selected":"a","date":"2026-10-19","decision":"Q-NX2-4 (a): packet 3 measures candidate retry policies as comparative arms on the same seeds. Any contract change is proposed to harness-onion separately; R12 makes no product decision."},{"id":"Q-NX2-5","selected":"a","date":"2026-10-19","decision":"Q-NX2-5 (a): packet 1's gates and the owner's Q-MAS1-2/REV2 ratio bounds per class; packet 1's rows byte-identical; argv 14 unchanged."},{"id":"Q-NX2-6","selected":"a","date":"2026-10-19","decision":"Q-NX2-6 (a): CONF-MAS-002, then CONF-MAS-003."},{"id":"Q3-2","selected":"a","date":"2026-10-20","decision":"Q3-2: \"(a) Keep bounds, expect FAIL (Recommended)\". Keep packet 1's bounds per class. Rev 4 preregisters that the duplicated-work p95 of C5 and C7, and C5's max, are expected to FAIL, with the MAS1-CARRY-1 cause. Record any FAIL honestly, as Q-MAS1-F1 (a) did, and change no parameter."},{"id":"Q-C5-LANE","selected":"On the lane, as C3/C7","date":"2026-10-20","decision":"Q-C5-LANE (new; I objected to the lane-method choice and put it to the owner): \"On the lane, as C3/C7 (Recommended)\". The tick-0 first claims of w1, w2 and w3 in C5 ride the attack lane. This is one rule for every class's scheduled first claims, fixed by precedent and not by the probe:\n- packet 1's C3 sends its role workers' tick-0 setup ACQUIREs with lane=True and no event tag (_classes.py@25c9ff0e ReplayStale.before_tick);\n- rev 3's own C5 text points to C3 for these claims;\n- rev 3's C7 puts its scheduled first claims on the lane.\nSo \"only event-tagged operations ride the lane\" doesn't match packet 1. Rev 4 states the rule once, in section 5's method list, and applies it to C5 and C7 alike. For w5's operations (Q3-5), apply the written rule \"scheduled events plus the victim's operations on its item\" and say which clause covers each operation. Disclose in rev 4 that the probe readings were seen before this decision, and that the owner fixed the rule by precedent."},{"id":"Q-R8-CAP","selected":"a","date":"2026-10-20","decision":"1. Q-R8-CAP: \"(a) r8 last, fold (Recommended)\".\n   - Fold r8's Q8-1 MINOR and Q8-2..4 NOTEs into BUILD_NOTES.md as binding build rules.\n   - Record design PASS_FOR_BUILD on that basis, citing r8's record ebae5fd4 and this decision. The packet review must check the build against each folded rule.\n   - r8 stands; the [ -e ] existence check is not a slip."}]
contracts: ["Base is main 05b74ff (CONF-MAS-001). MAS-RA-010 packet 2, the security half: classes C5 (a colluding verifier; a node with a declared conflicting objective), C6 (cross-agent exfiltration: a credential into context, a secret in a tool output, content in a message, grant reuse, expiry, mismatch and input schema) and C7 (resource exhaustion: a runaway loop, a retry storm, a hanging tool, a claim flood) on the same offline, standard-library harness, with the ledger reproduced byte for byte. One packet, branch and PR.","Owner decisions Q-NX2-1..6 (2026-10-19), Q3-2, Q-C5-LANE and Q-R8-CAP (2026-10-20), relayed by the lane monitor, are recorded verbatim in ownerDecisions above and in fixtures/ci/conf-mas-002-checkpoint.json. The lane rule is built on monitor decision MON-C5-LANE-ITEMS, the monitor's reading of Q-C5-LANE: a scheduled first claim's (worker, item) pair joins lane_items, so that worker's whole path on that item rides the attack lane, in C5 and C7 alike.","Clean room (Q-NX-2, Q-NX2-3): the rules are restated in R12's own words from harness-onion main 27c54605a3dcdbe86522a6bd18a5e19faa5cb40b. tests/mas/contracts.json pins ten source files by sha256 and size; packet 1's nine are byte-identical at 35b733b5, and loop-trace.schema.json is new to the pin set. No bytes are copied, so there is no edge record. The owner's warm-start repositories, R10 source and W03 work in progress are not read (tests/mas/attestation.json).","An independent test campaign (HO-D2): CONF-MAS-002 is an input to CONF-A3-001, not a gate, and makes no product or scope decision. A PASS does not lift topology-coordination's denial of agents with conflicting objectives (Q-M4-10 (a)); C5 measures one admitted conflicting agent's effect, reported and not gated.","Packet 1's four ledger rows are byte-identical to CONF-MAS-001's (Q-NX2-5 (a)); acceptance argv 14 is unchanged. C5's and C7's duplicated-work bound is preregistered as an expected FAIL (Q3-2 (a)): packet 1's carried revision exhaustion (MAS1-CARRY-1), measured by packet 3, not a security-half defence; the bounds and parameters are unchanged.","Owner decision D5a: tests/mas/test_oracle_p2.py holds oracle tests written outside the candidate by a separate agent from the design's preregistered behaviour, black-box. The packet changes no gate-material path (ci/, schemas/, policies/, legal/, docs/harnesses/, verifier docs); fixtures/ci/ is R12's checkpoint-chain data."]
deliverables: ["The tests/mas area extended: classes.json with C5 to C7 and the gateway data, the harness rules (grants, input validity, the closed message body, delivery canary hits, the kernel's budgets, retries and timeouts, admission, redaction and the credential rule), the scenarios and extractors, the ledger with C5's and C7's recorded FAILs and C5's ungated measurement, the re-pinned contracts and attestation, packet 1's preregistered test edits, two packet-2 test modules and the oracle tests written outside the candidate (D5a), and the README; the chain-test record test and the chain record; one required verify from the owner-operated verifier."]
excluded: ["Any frozen-code change (the checkpoint helper, HELPER_SHA256), any ci/ or other gate-material path, any dependency (pyproject.toml, toolchain.lock); any change to src/, probes/ or tests/enforcement/; any change to a bound or parameter after the first results; packet 3's classes (C8 to C10), the MAS1-CARRY-1 retry-policy arms, event-scoped depth engagement and the CONF-A3-001 record; lifting the conflicting-objective denial; real models, networks, processes, clouds or tenants; W03 or R10 source; the owner's warm-start repositories."]
