elected":"a","date":"2026-10-13","decision":"W04-4a design review = (a) \"Fix + final round 6\": apply D5-1..D5-3 and the notes, then run design review round 6 as the last design round. Its NOTEs are carried, and any MAJOR comes back to the owner (via me) before anything else happens."},{"id":"Q-T16","selected":"a","date":"2026-10-13","decision":"D6-1 = (a) \"Fix and build\": apply the D6-1 fix (take the generation from the execution's last allowed exchange that names one; E07-GATE is NOT_RUN when none does; the README requires a generation on gate rows; the reviewer's runs become tests) plus the D6-2/D6-3 README MINORs and the cheap NOTEs. Go to the build without another design round; the packet's own review re-checks D6-1 first."}]
contracts: ["Base is main 25f38a5 (CONF-ENF-003). W04-4a of the adopted W04-0 plan (split by owner decision Q-T12): the case ledgers and catalogs of TG-04 (host, NATIVE_HOST, obligations E01-E07, E11, E12, acceptance A03, A04) at tests/enforcement/tg04_host/ and TG-05 (clocks, NATIVE_LIFETIME, obligations E07, E08, E11, acceptance A02, A05) at tests/enforcement/tg05_clocks/, the native probe workspace at probes/enforcement/ with the TG-05 probes, and the TG-05 verdict evaluator. The TG-04 probes come with CONF-ENF-005 (W04-4b). One packet, branch and PR.","Owner decisions Q-T2-B, Q-T2-TOOL, Q-T12, Q-T13, Q-T14, Q-T15 and Q-T16 (2026-10-13, via the lane monitor) are recorded verbatim in ownerDecisions above and in fixtures/ci/conf-enf-004-checkpoint.json.","Independence: the attestation tests/enforcement/attestations/conf-enf-004.json carries the plan's fields. Expected results come only from the pinned contracts: the catalog rows (SELinux matrix v4 checks, seccomp v2 decisions, native v3 vectors and model rules, I05 v3 transcripts, W02D items and spec steps) and the obligation rows of docs/alpha-2/ENFORCEMENT_FEASIBILITY.md (a2eab93, recorded addition, Q-T13) with the owner-confirmed reading of E08. No R10 source, W03 work in progress, W05 build or R12 reader source is read or run for expected results. The installed Rust 1.99.0 tree is used only as a compiler for the author's local builds (Q-T2-TOOL).","Ledgers: tg04_host/results.json and tg05_clocks/results.json list each group's plan cases, all W06_NATIVE_ONLY and NOT_RUN_ENV_UNAVAILABLE (never PASS before W06, AGENTS rule 14), blocked by D-W02A-F2 and by D-PROBE-ROUTE (the W06 fault-injection route, Q-T14), each with its catalog rows and their source files, its obligation rows, its probe (or probeIn CONF-ENF-005), its verdict checks, the LEDGER-E09 properties it carries with the reader checks that observe them (Q-T11, checked from both sides against E09's own table), its permissions in SELinux matrix v4 terms with the domains the matrix grants them to (TG-05; TG-04's come with its probes), and the harness restore W06 runs after every TG-05 run. The TG-02 and TG-03 ledgers stay byte-identical.","Probes (Q-T2-B): probes/enforcement/ is a Rust workspace (common, tg04_host stub, tg05_clocks), standard library only, no crates or build scripts; unsafe and foreign calls only in common/src/sys.rs; generated nr.rs (seccomp v2 syscall numbers), expected.rs (native v3 role constants) and tree.rs (the probe-tree digest). Each TG-05 probe injects one fault (stop the CPython roles, suspend across the deadline, set the wall clock back, kill a peer, kill the reader) and writes a timeline; it never decides a case. CI checks the source with stdlib gates (tests/enforcement/test_probes.py); both musl targets were built locally with the installed Rust 1.99.0 tree, recorded in probes/enforcement/BUILD_EVIDENCE.json as author evidence tied to the tree digest.","Verdicts: tests/enforcement/tg05_clocks/_verdicts.py judges a probe timeline with W06's answer log under the E07, E08 and E11 rules and the I05 v3 model's refusal order, scoped to the tested execution, in bounded windows where the implementation each case targets would still allow; test_verdicts.py judges synthetic runs, including the implementations each case is meant to catch. The design went through six independent design rounds (Q-T15, Q-T16); round 6's NOTEs are carried.","History: one closed chain record fixtures/ci/conf-enf-004-checkpoint.json and its registry entry; no frozen-code change. Changed: test_bootstrap.py (the new snapshot, area modules and toolchain amendments), _catalog.py (the native groups), toolchains.json (Q-T2-B, Q-T2-TOOL), the snapshot manifest (Q-T13), the README and tests/ci_checkpoint/test_checkpoint_chain.py (the CONF-ENF-004 record test and registry entry 4).","No ci/ or src/ path changes and no new command: the 13 CONF-ENF-003 commands are inherited unchanged and in order; the inherited tests/enforcement discover argv runs the new tg04_host and tg05_clocks packages and test_probes.py."]
deliverables: ["The TG-04 and TG-05 case ledgers and catalogs, the ENFORCEMENT_FEASIBILITY.md snapshot (Q-T13), the probe workspace under probes/enforcement/ with the TG-05 probes and its author build evidence (Q-T2-B), the TG-05 verdict evaluator and its tests, the probe CI gates, the attestation and the chain record; one required verify from the owner-operated verifier."]
