contracts: ["Base is main 094b553 (CONF-ENF-007). The W04 jsonschema ledger conversion: TG-01's nine vector sets whose reference models need jsonschema, and TG-08's S44 through the native v3 replay, closing gaps G-JSONSCHEMA and G-REPLAY-INPUTS. CONF-ENF-005, CONF-ENF-006 and CONF-ENF-008 stay reserved for the stopped W04-4b, W04-4c and W04-5 (owner decision Q-LC-3). One packet, branch and PR.","Owner decisions Q-LC-1..4 (2026-10-18, relayed by the lane monitor) are recorded verbatim in ownerDecisions above, in fixtures/ci/conf-enf-009-checkpoint.json and in tests/enforcement/toolchains.json's amendments.","The child process (Q-LC-2): tests/enforcement/tg01_contract/_child.py launches /opt/planeon/toolchains/met-001/.venv/bin/python3 -I -B by absolute path, once per run, with a minimal environment; the venv is the owner's G-JSONSCHEMA root bundle install (policy d9b99bd6, Q-JS-1..4). toolchains.json's row python-met-001-child pins the interpreter (path, base root, version, prefixes), jsonschema 4.24.0 and the venv's tree digest. A missing or changed interpreter, jsonschema or venv tree, a launch failure, output on stderr, a report that is not the closed shape, a child vector not run, or a pinned flip not caught fails the run; nothing becomes NOT_RUN_ENV_UNAVAILABLE. R12's own interpreter and code stay standard library only (Q-T1, Q-T4); nothing is prefetched or added as a dependency (AGENTS rule 16).","Replays: the nine child sets keep their REPLAYS keys; in R12's interpreter each runs its standard-library pre-checks and returns the child's verified tally. The I05 and I07 replays are unchanged; the I06 backend profile v2 and native qualification v3 replays are written here from the adopted layers' replay rules at a2eab93, without their contract-history checks, with closed vector operations (append and list selectors) and expected results only from the vectors.","Inputs (Q-LC-4): the eight G-REPLAY-INPUTS files are snapshotted byte-exact from harness-onion a2eab93 as recorded additions (manifest 43 to 51 rows), pinned in test_bootstrap's REPLAY_INPUTS; no existing snapshot changes.","Ledgers: tg01_contract/results.json (packet CONF-ENF-009) records 6,090 PASS and no NOT_RUN, each row with its runner (IN_PROCESS or CHILD_MET_001); tg08_compatibility/results.json (packet CONF-ENF-009) has S44 PASS, its MATRIX and INSTALLED cases unchanged; the TG-02 to TG-05 ledgers are byte-identical.","Independence: tests/enforcement/attestations/conf-enf-009.json carries the plan's fields; its input digests are the files as this packet leaves them. No R10 source, W03 work in progress, W05 build or R12 reader source was read or run for expected results.","No frozen-code change (the checkpoint helper), no ci/, src/ or probes/ path, no new offline command: the same 13 commands as CONF-ENF-007.","Design: four independent design review rounds; revision 4 passed (PASS_FOR_BUILD)."]
deliverables: ["TG-01's child process and its pins, the I06 v2 and native v3 replays, the eight recorded-addition snapshots, the regenerated TG-01 and TG-08 ledgers, the closed gaps, the tests, the attestation and the chain record; one required verify from the owner-operated verifier."]
excluded: ["Any frozen-code change (the checkpoint helper, HELPER_SHA256), any ci/ path or new command, any dependency (pyproject.toml, toolchain.lock), any change to an existing snapshot; any change to the R12 reader (src/) or the probe workspace; jsonschema in R12's own interpreter; the TG-04 probes (CONF-ENF-005), product fault injection (CONF-ENF-006) and W04-5 (CONF-ENF-008); W05's source tests and W06's installed run; W03 or R10 source; live, native or networked execution."]
