contracts: ["Base is main 029abe70acae5286a3fd0e943d71a0f081b857e0 (CONF-CI-002). W04-1 of the adopted W04-0 plan (harness-onion architecture/enforcement-test-plan/traceability.json at a2eab9365c8663cc1ae23a666e864b821f600fa6). One packet, branch and PR.","Owner decisions Q-T1, Q-T2 and Q-T3 (2026-10-11, via the lane monitor) are recorded verbatim in ownerDecisions above and in fixtures/ci/conf-enf-001-checkpoint.json; Q-T1 and Q-T2 also in tests/enforcement/toolchains.json.","Checkpoint chain (Q-T3): fixtures/ci/checkpoints.json is an append-only registry in canonical bytes. Entry 0 is CONF-CI-002's record, still pinned by CI_002_RECORD_SHA256; each later entry is one closed record fixtures/ci/<packet>-checkpoint.json carrying its predecessor's digest, the owner decisions, and every path the packet deleted, changed or added with exact after-pins and before-images. A record may not name the registry or any registered record.","current_tracked_inventory checks every registered record newest first against the git tree (head_tracked_inventory) and projects it away: its additions and itself removed, its deletions and changes restored to their before-images, the registry cut back to the entries before it. The result is the CONF-CI-002 head view (029abe7), which tracked_inventory hands to the CONF-CI-002 layer exactly as before. No CONF-CI-002 record, test or older pin changes; only HELPER_SHA256 moves, by the PERF-004 constant rule.","Anchoring: records after CONF-CI-002 are anchored by the registry and the predecessor digests, not by a code constant (the class of CONF-CI-002 review note K1-3). Later packets add only their record, their registry entry, data and tests; a later change to this helper is a frozen-code change that its own record must name.","Enforcement area tests/enforcement/: stdlib unittest only (Q-T1), no dependency; Rust+musl deferred (Q-T2), nothing installed. Contract snapshots: the 36 adopted contract files the plan names plus the plan itself, byte-exact from harness-onion a2eab93, pinned by sha256 and size in tests/enforcement/snapshots/manifest.json and cross-checked against the plan's own pins. The independence attestation tests/enforcement/attestations/conf-enf-001.json carries the plan's fields; no R10 source, no W03 work in progress, and no implementation is read or run.","Recorded gaps, decided before W04-2: G-JSONSCHEMA (jsonschema is outside the standard library; native_qualification_v3.py imports it at load and i05_gate_channel_v3.py in check_frame, so with their sibling imports the I05, I07, I06 v2 and native v3 reference-model paths cannot all run in R12 as it stands) and G-I06-V1 (i06_backend_profile_v2.py imports I06 v1, scripts/i06_backend_profile.py, which the plan's contract set does not name). The SELinux v4, seccomp v2, admission v3 and W02D models are stdlib-only and self-contained.","No ci/ path changes: the chain tests run in the existing ci-002-checkpoint target (tests/ci_checkpoint/), and the enforcement area runs as one direct argv appended after the 12 inherited commands, which are unchanged and in order."]
deliverables: ["The checkpoint chain layer and registry with its tests, the enforcement test area (snapshots, manifest, attestation, toolchain record, bootstrap tests); one required verify from the owner-operated verifier."]
excluded: ["Any change to an older record, fixture digest, doc fence or test identity; any ci/ path; any dependency or toolchain install; TG-01..TG-08 test source (W04-2 onward); W03 or R10 source; live, native or networked execution."]
