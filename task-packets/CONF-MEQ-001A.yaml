objective: "Build the contract-independent core of MODEL-EXIST-QUAL-001's campaign (MEQ-CLIENT-0) as data and tests under the new root tests/model_endpoint/ (lane-monitor ruling MON-R12-MEQC, Q-MEQC-1 (a)): a standard-library probe client for the owner's engine listener over http.client, its base-URL guard (loopback and private-range IP literals and the name localhost mapped without a resolver call; owner decision Q-MEQ-SCOPE), the fixed parameters (2 s connect; 30 s request, 600 s for linux-amd64-cpu; an 8 MiB response bound; one request per connection; no proxies and no redirects), an injectable connection factory, a closed MEQ_* error set, and the per-profile evidence record (one record per profile id, never pooled; owner decision Q-MEQ-PROFILES). The tests run over socket.socketpair() with an in-thread fake and use no TCP. No endpoint is contacted. Data and tests only: no src change."
