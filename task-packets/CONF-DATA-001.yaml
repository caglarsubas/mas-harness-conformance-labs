id: "CONF-DATA-001"
repository: "mas-harness-conformance-labs"
branch: "codex/conf-data-001-cases"
objective: "Add R12's conformance cases for harness-onion's data-correctness contract (DATA-CORRECTNESS-001, merged as MET-007 at cf253506), as data and tests: a new tests/data_correctness root with R12's own judge of the record's seven rule families, the record's 13 golden vectors byte-identical and judged 13 of 13, and a deterministic simulation (fake monotonic and wall clocks, process pauses, skew and jumps, duplicate, reordered and lost deliveries, the five PAR-D1 crash points, mixed-version records, derived stores and replay) that runs 29 cases in defended and one-switch control arms over seeds 1 to 32, with a results ledger, the record's 103 obligation cells (adapters PENDING) and an entry for CONF-A3-001's campaign record. Three cases are R12 extensions, labelled and provisional. Data and tests only: no src change."
