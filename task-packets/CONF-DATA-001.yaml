contracts: ["Base is R12 main b50fead247dae755dc1ebc3a36cc99c9e7c6f2ee (CONF-MEQ-001A-F). One packet, branch and PR, under the lane monitor's GO for CONF-DATA-001 (MON-C15-R12 and MON-CD-RULE, 2026-11-15; conventions C14 to C16, tier LIGHT), after the visionary's lock 54 set the item READY.","Lane-monitor rulings under the owner's 2026-10-22 delegation, cited here and not listed as owner decisions: Q-CD-1 (LIGHT; the one packet review reads _judge.py and _sim.py in full), Q-CD-2 (one packet), Q-CD-3 (the golden vectors copied byte-identical and the model restated), Q-CD-5 (per-arm trace digests now, HR-REPLAY-FIXTURES-001's form later), Q-CD-6 (seven families and 13 vectors, lock 54) and Q-CD-7 (the base fetched by the lane monitor); the visionary's VIS-C15-SPLIT on Q-CD-4 (CK-04, CV-04 and DD-04 kept as R12_EXTENSION on four conditions); D1 to D4 (MON-CD-DRY-RULE); Q-ORC-1 to Q-ORC-3 (MON-CD-ORC-RULE); the acceptance-run words MON-CD-ACCEPT-GO, MON-CD-RUN2-GO and MON-CD-RUN2-OK; and the packet-review word MON-CD-PKT-GO.","The contract is harness-onion cf253506 (MET-007): architecture/data-correctness/record.json, schema.json, scripts/data_correctness.py and the record's 13 golden vectors, each pinned by sha256 and size in tests/data_correctness/contracts.json; golden/ holds the 13 vectors byte-identical to the pins. tests/data_correctness/_judge.py restates the seven rule families RF-1 to RF-7 and their codes DC_WRITE_SKEW, DC_FENCE, DC_CLOCK, DC_OPID, DC_VERSION, DC_DERIVED and DC_REPLAY_STATE in R12's own words; no bytes of the reference model are copied and nothing is imported across repositories. The judge returns each golden vector's expect, 13 of 13. sourceReuse stays empty: the golden vectors are first-party contract data, pinned as tests/mas pins its contracts.","The simulation, tests/data_correctness/_sim.py, runs the 29 cases of cases.json (WS-01 to WS-03, FN-01 to FN-03, CK-01 to CK-04, OP-01 to OP-07, CV-01 to CV-06, DD-01 to DD-04, RS-01 and RS-02) in 60 arms over seeds 1 to 32, 1,920 runs. A run is a pure function of (case, arm, seed); the random source is seeded by (case, seed) only, so a case's arms share the seed's schedule, and each CONTROL or NEGATIVE arm differs from the case's DEFENDED arm in one switch. Each run gives a trace in the vector shape, whether it broke its family's rule, and whether the business outcome read from the final state is wrong. The five PAR-D1 crash points are injected in WS-01, OP-01 to OP-04, OP-07, FN-01, FN-02 and CK-02.","Gates, in results.json (r12.data-correctness-results/v1, regenerated byte for byte by _ledger.py): in every run the judge returns the trace's expect and no violation happens without a broken rule; DEFENDED arms have no errored run, broken rule or violation; CONTROL and NEGATIVE arms have no errored run, refusals only with the case's code, and violations at or above the arm's floor (32, or 24 for OP-01, OP-03 and OP-04, or 8 for OP-07). Errored runs count in the denominator. Each arm keeps the sha256 over its sorted per-seed trace digests. An aborted RF-1 commit step carries an informational aborted marker that no judge reads (Q-ORC-3 (a)).","The non-author D5a oracle (owner decision D5a), tests/data_correctness/test_oracle_conf_data_001.py (54 tests), was written by a fresh agent from the design and the contract only; its identity is KEEP with notes (MON-CD-ORC-RULE, Q-ORC-2: its disclosed one-call slips, one sed -i write and two reads of its own file, all inside its allowed reads and writes). Slip and disposition (MON-CD-ORC-RULE, Q-ORC-1 (a), class (b)): the build first drew CK-01's wall-clock jumps backward only, narrowing the design's -5 s to +5 s without a disposition; the oracle refused it. CK-01 now draws, in every seed, a forward jump of +1 to +2,500 ms early in the lease and a backward jump of -(f + d) ms, d from 1 to 2,500, before expiry, both within 5 s; its floor stays 32 and its catalogue text is the design's again.","Findings routed to R00 through the lane monitor, not gates on this packet: F-CD-1, RF-1's reissue rule covers a retry after a serialization failure only (a process that dies between an effect issued inside its transaction and the commit neither commits nor aborts, so its restart's reissue is not RF-1's refusal; RF-4's operation IDs, deduplicated at the effect's store, cover it; WS-03 injects no crash for that reason); F-CD-2, the reference model at cf253506 forgets an abort when a retry reuses the aborted transaction's name, while R12's judge remembers it.","PACKET review round 1 (one fresh non-author reviewer, record 665f9c56) gave CHANGES_REQUIRED with no MAJOR finding. Under C16 its four MINOR findings are closed in this head by script-checked claims: CD-P1-1, the judge remembers an abort across a reused transaction name, with a test; CD-P1-2, the README states each floor's reason; CD-P1-3, F-CD-1 is stated in these contracts; CD-P1-4, every ruling is cited here and in the PR body.","R12 extensions (VIS-C15-SPLIT): CK-04 (RF-3, host replacement), CV-04 (RF-5, opaque extension data kept inert) and DD-04 (RF-6, PAR-D1's restore scenario: the deletion ledger re-applied before serving, residuals stated) are labelled R12_EXTENSION, provisional, with expected arms by R12, in cases.json, results.json and campaign-record.json; they are R12-authored cases, never conformance to the merged record's 13 vectors, and follow the record's successor when it rules (HO-D2). Their candidate vectors go to R00 through the lane monitor, never as a gate on this packet.","obligations.json restates the record's 103 obligation cells (24 deployables; RF-1 24, RF-2 6, RF-3 24, RF-4 10, RF-5 24, RF-6 5, RF-7 10), each naming its MODEL_OPS cases and its R12 extensions apart, with adapterState PENDING. campaign-record.json is this packet's entry for CONF-A3-001's campaign record, an input and not a gate.","R12's checkpoint chain (owner decision Q-T3 (a)): fixtures/ci/conf-data-001-checkpoint.json is entry 17 of fixtures/ci/checkpoints.json (keep 18), after CONF-MEQ-001A-F's record (e1b4b401e7376629d1c241ae99d62e9cdd09f273c80f69f4f13f1bcbdcde3797). It names the 1 changed path with its before-image at the base and the 28 added paths (the packet YAML and the 27 files of tests/data_correctness), each with an exact after-pin, and no deletion. No src/, ci/, probes/, tests/enforcement/ or schemas/ path changes, and SUITE_ROOTS is untouched.","Every result stays UNIT_VERIFICATION_ONLY with nativeAcceptance false."]
deliverables: ["The tests/data_correctness root: the judge, the simulation, the ledger, the case catalogue, the contract pins, the 13 golden vectors, the obligation matrix, the results ledger, the CONF-A3-001 campaign record entry, the README, its test modules and the non-author D5a oracle; the record test and the value[17] registry assertion in tests/ci_checkpoint/test_checkpoint_chain.py; the chain record and its registry entry; this packet YAML with the 16 inherited acceptance commands and one appended (17); one required verify from the owner-operated verifier."]
excluded: ["Any src/ hunk or path (no Q-T3 exception is used); any plane adapter case (later packets, as each plane's adapter lands); any run against an endpoint, a network, a process, a file outside the suite or a clock; the record's successor and its vectors (R00's); the information-lifecycle table and the per-boundary compatibility matrix; HR-REPLAY-FIXTURES-001's fixture form; every gate-material path (ci/, policies/, legal/, docs/harnesses/, verifier docs), probes/, tests/enforcement/ and schemas/; any change to tests/mas; any native, installed or tenant claim, and any exactly-once claim."]
